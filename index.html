<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinD - Women-Owned Spaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF6C41;
  --coral:#FF3C2D;
  --ember:#7B2F25;
  --peach:#FFCDB8;
  --blush:#FFF0EC;
  --cream:#FFFAF7;
  --text-dark:#1C0A06;
  --text-mid:#5C2D1E;
  --text-light:#B07060;
}
html{scroll-behavior:smooth}
body{font-family:"DM Sans",sans-serif;background:var(--cream);color:var(--text-dark);overflow-x:hidden}

nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 3rem;height:70px;
  background:rgba(255,250,247,0.93);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,108,65,0.1);
  transition:box-shadow 0.3s;
}
nav.scrolled{box-shadow:0 2px 24px rgba(123,47,37,0.07)}
.nav-logo img{height:42px;display:block}
.nav-links{display:flex;align-items:center;gap:2.5rem;list-style:none}
.nav-links a{text-decoration:none;font-size:12px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-mid);transition:color 0.2s}
.nav-links a:hover{color:var(--orange)}
.nav-cta{background:var(--orange)!important;color:white!important;padding:9px 22px;border-radius:2px;}
.nav-cta:hover{background:var(--ember)!important}

.hero{min-height:100vh;padding-top:70px;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden}
.hero-left{display:flex;flex-direction:column;justify-content:center;padding:5rem 4rem 5rem 5rem;z-index:2}
.hero-eyebrow{font-size:10px;font-weight:500;letter-spacing:0.28em;text-transform:uppercase;color:var(--orange);margin-bottom:2rem;display:flex;align-items:center;gap:12px}
.hero-eyebrow::before{content:"";width:28px;height:1px;background:var(--orange);display:block}
.hero-headline{font-family:"Cormorant Garamond",serif;font-size:clamp(3rem,4.5vw,5.2rem);font-weight:300;line-height:1.07;color:var(--text-dark);margin-bottom:2rem}
.hero-headline em{font-style:italic;color:var(--coral)}
.hero-sub{font-size:15px;font-weight:300;line-height:1.85;color:var(--text-mid);max-width:420px;margin-bottom:3rem}
.hero-actions{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.btn-primary{background:var(--orange);color:white;text-decoration:none;font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;padding:14px 30px;border-radius:2px;transition:background 0.2s,transform 0.15s;display:inline-block}
.btn-primary:hover{background:var(--ember);transform:translateY(-1px)}
.btn-ghost{color:var(--text-mid);text-decoration:none;font-size:11px;font-weight:400;letter-spacing:0.12em;text-transform:uppercase;border-bottom:1px solid var(--text-light);padding-bottom:2px;transition:color 0.2s,border-color 0.2s}
.btn-ghost:hover{color:var(--orange);border-color:var(--orange)}
.hero-right{position:relative;overflow:hidden;background:var(--blush)}
#hero-map{position:absolute;inset:0}
.map-fade-left{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to right,var(--cream) 0%,rgba(255,250,247,0.3) 40%,transparent 65%)}
.map-fade-bottom{position:absolute;bottom:0;left:0;right:0;height:100px;z-index:2;pointer-events:none;background:linear-gradient(to top,var(--cream),transparent)}

.stats-strip{background:var(--ember);padding:1.5rem 5rem;display:flex;align-items:center;gap:3.5rem}
.stat-item{display:flex;flex-direction:column;gap:5px}
.stat-num{font-family:"Cormorant Garamond",serif;font-size:2rem;font-weight:400;color:var(--peach);line-height:1}
.stat-label{font-size:10px;font-weight:300;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,205,184,0.55)}
.stat-div{width:1px;height:36px;background:rgba(255,205,184,0.18)}

.ethos-strip{background:var(--blush);padding:2.5rem 5rem;border-top:1px solid rgba(255,108,65,0.1);border-bottom:1px solid rgba(255,108,65,0.1);display:flex;align-items:center;gap:4rem;overflow:hidden}
.ethos-item{display:flex;align-items:center;gap:14px;white-space:nowrap;flex-shrink:0}
.ethos-dot{width:5px;height:5px;border-radius:50%;background:var(--orange);flex-shrink:0}
.ethos-text{font-family:"Cormorant Garamond",serif;font-size:1.1rem;font-style:italic;font-weight:300;color:var(--text-mid)}

.manifesto{padding:8rem 5rem;display:grid;grid-template-columns:1fr 1fr;gap:7rem;align-items:center;background:var(--cream);position:relative}
.manifesto::before{content:open-quote;position:absolute;top:1rem;left:2.5rem;font-family:"Cormorant Garamond",serif;font-size:22rem;color:rgba(255,108,65,0.04);line-height:1;pointer-events:none}
.section-eyebrow{font-size:10px;font-weight:500;letter-spacing:0.28em;text-transform:uppercase;color:var(--orange);margin-bottom:1.75rem;display:flex;align-items:center;gap:12px}
.section-eyebrow::before{content:"";width:28px;height:1px;background:var(--orange);display:block}
.manifesto-headline{font-family:"Cormorant Garamond",serif;font-size:clamp(1.9rem,3vw,3rem);font-weight:300;line-height:1.2;color:var(--text-dark);margin-bottom:2rem}
.manifesto-headline em{font-style:italic;color:var(--coral)}
.manifesto-body{font-size:15px;font-weight:300;line-height:1.9;color:var(--text-mid)}
.manifesto-body p+p{margin-top:1.25rem}
.pull-quote{font-family:"Cormorant Garamond",serif;font-size:clamp(1.5rem,2.2vw,2.2rem);font-weight:300;font-style:italic;line-height:1.45;color:var(--coral);border-left:2px solid var(--orange);padding-left:2rem;margin-bottom:3rem;border-radius:0}
.value-list{display:flex;flex-direction:column;gap:1.25rem}
.value-item{display:flex;align-items:flex-start;gap:1rem}
.value-dot{width:5px;height:5px;border-radius:50%;background:var(--orange);margin-top:8px;flex-shrink:0}
.value-text{font-size:14px;font-weight:300;line-height:1.7;color:var(--text-mid)}

.map-section{padding:5rem 5rem 0;background:var(--blush)}
.section-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2.5rem}
.section-title{font-family:"Cormorant Garamond",serif;font-size:clamp(2rem,3vw,3rem);font-weight:300;line-height:1.1;color:var(--text-dark)}
.section-title em{font-style:italic;color:var(--coral)}
.filter-bar{display:flex;gap:0.4rem;flex-wrap:wrap}
.filter-btn{background:none;border:1px solid rgba(92,45,30,0.2);color:var(--text-mid);font-family:"DM Sans",sans-serif;font-size:11px;font-weight:400;letter-spacing:0.08em;text-transform:uppercase;padding:7px 15px;border-radius:2px;cursor:pointer;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{background:var(--orange);border-color:var(--orange);color:white}
.map-container{position:relative;height:540px;border-radius:4px 4px 0 0;overflow:hidden;box-shadow:0 -6px 30px rgba(123,47,37,0.06)}
#main-map{height:100%;width:100%}

.places-preview{padding:4rem 5rem 6rem;background:var(--blush)}
.places-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;margin-top:2.5rem}
.place-card{background:var(--cream);border:1px solid rgba(255,108,65,0.12);border-radius:4px;padding:1.75rem;cursor:pointer;transition:all 0.25s;text-decoration:none;color:inherit;display:block}
.place-card:hover{border-color:var(--orange);transform:translateY(-3px);box-shadow:0 12px 30px rgba(255,108,65,0.1)}
.place-type{font-size:9px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:var(--orange);margin-bottom:0.75rem}
.place-name{font-family:"Cormorant Garamond",serif;font-size:1.4rem;font-weight:400;color:var(--text-dark);margin-bottom:0.5rem;line-height:1.2}
.place-area{font-size:11px;font-weight:300;color:var(--text-light);margin-bottom:1rem;display:flex;align-items:center;gap:5px}
.place-area::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--orange);display:inline-block;opacity:0.6}
.place-desc{font-size:13px;font-weight:300;line-height:1.7;color:var(--text-mid)}
.place-footer{margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid rgba(255,108,65,0.08);display:flex;align-items:center;justify-content:space-between}
.owner-badge{font-size:9px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;color:var(--ember);background:rgba(123,47,37,0.07);padding:4px 10px;border-radius:2px}
.see-all{margin-top:3rem;text-align:center}

.power-section{background:var(--ember);padding:7rem 5rem;display:grid;grid-template-columns:1fr 1fr;gap:6rem;align-items:center}
.power-headline{font-family:"Cormorant Garamond",serif;font-size:clamp(2rem,3.5vw,3.5rem);font-weight:300;color:var(--peach);line-height:1.15;margin-bottom:2rem}
.power-headline em{font-style:italic;color:white}
.power-body{font-size:14px;font-weight:300;line-height:1.9;color:rgba(255,205,184,0.7);margin-bottom:2.5rem}
.power-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.power-stat{background:rgba(255,205,184,0.07);border:1px solid rgba(255,205,184,0.12);border-radius:4px;padding:1.5rem}
.power-stat-num{font-family:"Cormorant Garamond",serif;font-size:2.2rem;font-weight:300;color:white;line-height:1;margin-bottom:6px}
.power-stat-label{font-size:11px;font-weight:300;color:rgba(255,205,184,0.55);letter-spacing:0.05em}

.doc-banner{background:var(--blush);padding:5rem;display:grid;grid-template-columns:1fr auto;align-items:center;gap:3rem;border-top:1px solid rgba(255,108,65,0.1)}
.doc-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,108,65,0.1);border:1px solid rgba(255,108,65,0.25);color:var(--orange);font-size:9px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;padding:6px 14px;border-radius:2px;margin-bottom:1.5rem}
.doc-badge-dot{width:5px;height:5px;border-radius:50%;background:var(--orange);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.doc-title{font-family:"Cormorant Garamond",serif;font-size:clamp(1.8rem,3vw,3rem);font-weight:300;color:var(--text-dark);line-height:1.15;margin-bottom:1rem}
.doc-title em{font-style:italic;color:var(--coral)}
.doc-sub{font-size:14px;font-weight:300;color:var(--text-mid);line-height:1.75;max-width:480px}
.yt-btn{display:flex;align-items:center;gap:10px;background:var(--orange);color:white;text-decoration:none;font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;padding:14px 28px;border-radius:2px;transition:background 0.2s;white-space:nowrap}
.yt-btn:hover{background:var(--ember)}

footer{background:var(--text-dark);padding:2.5rem 5rem;display:flex;align-items:center;justify-content:space-between}
.footer-links{display:flex;gap:2rem;list-style:none}
.footer-links a{text-decoration:none;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,205,184,0.4);transition:color 0.2s}
.footer-links a:hover{color:var(--peach)}
.footer-copy{font-size:11px;color:rgba(255,205,184,0.25)}

@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.fade-up{opacity:0;animation:fadeUp 0.8s ease forwards}
.fd1{animation-delay:0.1s}.fd2{animation-delay:0.28s}.fd3{animation-delay:0.44s}.fd4{animation-delay:0.6s}

.leaflet-popup-content-wrapper{border-radius:4px!important;font-family:"DM Sans",sans-serif!important;box-shadow:0 8px 28px rgba(0,0,0,0.1)!important}
.leaflet-popup-content{margin:14px 16px!important}
.popup-type{font-size:9px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:#FF6C41;margin-bottom:4px}
.popup-name{font-family:"Cormorant Garamond",serif;font-size:1.15rem;font-weight:400;color:#1C0A06;margin-bottom:3px}
.popup-area{font-size:11px;color:#B07060;margin-bottom:8px}
.popup-link{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#FF6C41;text-decoration:none;border-bottom:1px solid #FF6C41;padding-bottom:1px}
</style>
</head>

<section class="manifesto">
  <div>
    <div class="section-eyebrow">Our Manifesto</div>
    <h2 class="manifesto-headline">
      This map is a love letter to the women who <em>built something anyway.</em>
    </h2>
    <div class="manifesto-body">
      <p>Not the ones who waited for permission. The ones who unlocked a door, hung a sign, and made a place that felt like theirs, and somehow in doing so, made it yours too.</p>
      <p>PinD exists because Google Maps will show you an address, but it will not tell you that you can exhale there. It will not tell you that the woman who owns that cafe sat at that counter for years before she put her name on the door.</p>
      <p>We are building a different kind of map. One made of stories, not listings. One that grows the same way trust does: slowly, personally, by word of mouth.</p>
    </div>
  </div>
  <div>
    <div class="pull-quote">
      Google Maps will show you an address. It will not tell you that you can exhale there.
    </div>
    <div class="value-list">
      <div class="value-item"><div class="value-dot"></div><div class="value-text">We map feeling, not just location. Safety, belonging, and the warmth of a space made with intention.</div></div>
      <div class="value-item"><div class="value-dot"></div><div class="value-text">We are not a directory. Every space here is a story, not a listing.</div></div>
      <div class="value-item"><div class="value-dot"></div><div class="value-text">Word of mouth is our oldest technology. PinD is its digital form.</div></div>
      <div class="value-item"><div class="value-dot"></div><div class="value-text">We start where we know. We grow only when it means growing well.</div></div>
    </div>
  </div>
</section>

    <h2 class="power-headline">
      To own a space in India,<br>as a woman,<br>is <em>quietly radical.</em>
    </h2>
    <p class="power-body">
      Property. Walls. A room of one's own. These have never been simple things for women in India to hold. Every business on this map is a woman who held one anyway. We think that deserves to be seen.
    </p>

  {id:6,name:"The Ink Room",area:"Colaba",type:"workspace",lat:18.9067,lng:72.8147,desc:"A members writing room. Founded by two journalists who needed a room of their own.",featured:true},
  {id:7,name:"Saee's Flower Studio",area:"Juhu",type:"retail",lat:19.1075,lng:72.8263,desc:"Seasonal florals, grown with intention. No plastic, no waste, no shortcuts.",featured:false},
  {id:8,name:"Prana Wellness",area:"Andheri",type:"wellness",lat:19.1197,lng:72.8464,desc:"Integrative health clinic run entirely by women practitioners.",featured:false},
];
const typeColor={cafe:"#FF6C41",retail:"#7B2F25",studio:"#4A6B4A",wellness:"#B05878",workspace:"#4A6B8A"};

const hMap=L.map("hero-map",{center:[19.076,72.8777],zoom:12,zoomControl:false,scrollWheelZoom:false,dragging:false,attributionControl:false});
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(hMap);
places.forEach(p=>{
  L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:"<div style='width:8px;height:8px;background:"+typeColor[p.type]+";border-radius:50%;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.2)'></div>",iconSize:[8,8],iconAnchor:[4,4]})}).addTo(hMap);
});

const mMap=L.map("main-map",{center:[19.05,72.84],zoom:12,scrollWheelZoom:false});
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{attribution:"&copy; OpenStreetMap &copy; CARTO"}).addTo(mMap);
let ml=L.layerGroup().addTo(mMap);

function renderMarkers(f){
  ml.clearLayers();
  (f==="all"?places:places.filter(p=>p.type===f)).forEach(p=>{
    const mk=L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:"<div style='width:13px;height:13px;background:"+typeColor[p.type]+";border-radius:50%;border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.22);cursor:pointer'></div>",iconSize:[13,13],iconAnchor:[6,6]})});
    mk.bindPopup("<div class='popup-type'>"+p.type+"</div><div class='popup-name'>"+p.name+"</div><div class='popup-area'>"+p.area+", Mumbai</div><a href='explore.html' class='popup-link'>View Details</a>",{maxWidth:200});
    mk.addTo(ml);
  });
}
renderMarkers("all");

function filterMap(type,btn){
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderMarkers(type);
}

document.getElementById("places-grid").innerHTML=places.filter(p=>p.featured).map(p=>`
  <a class="place-card" href="explore.html">
    <div class="place-type">${p.type}</div>
    <div class="place-name">${p.name}</div>
    <div class="place-area">${p.area}, Mumbai</div>
    <div class="place-desc">${p.desc}</div>
    <div class="place-footer"><span class="owner-badge">Women-Owned</span><span style="color:#B07060;font-size:14px">&#x2192;</span></div>
  </a>`).join("");

window.addEventListener("scroll",()=>{
  document.getElementById("navbar").classList.toggle("scrolled",window.scrollY>40);
});
document.querySelectorAll("a[href^='#']").forEach(a=>{
  a.addEventListener("click",e=>{
    const t=document.querySelector(a.getAttribute("href"));
    if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"});}
  });
});
<\/script>
</body>
</html>
