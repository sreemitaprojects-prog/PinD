html{scroll-behavior:smooth}

.hero{min-height:100vh;padding-top:70px;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden}
.hero-left{display:flex;flex-direction:column;justify-content:center;padding:5rem 4rem 5rem 5rem;z-index:2}
.hero-eyebrow{font-size:10px;font-weight:500;letter-spacing:0.28em;text-transform:uppercase;color:var(--orange);margin-bottom:2rem;display:flex;align-items:center;gap:12px}

.pull-quote{font-family:"Cormorant Garamond",serif;font-size:clamp(1.5rem,2.2vw,2.2rem);font-weight:300;font-style:italic;line-height:1.45;color:var(--coral);border-left:2px solid var(--orange);padding-left:2rem;margin-bottom:3rem;border-radius:0}

.places-preview{padding:4rem 5rem 6rem;background:var(--blush)}

.power-eyebrow{font-size:10px;font-weight:500;letter-spacing:0.28em;text-transform:uppercase;color:var(--peach);opacity:0.7;margin-bottom:1.75rem;display:flex;align-items:center;gap:12px}

.power-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.power-stat{background:rgba(255,205,184,0.07);border:1px solid rgba(255,205,184,0.12);border-radius:4px;padding:1.5rem}
.power-stat-num{font-family:"Cormorant Garamond",serif;font-size:2.2rem;font-weight:300;color:white;line-height:1;margin-bottom:6px}
.power-stat-label{font-size:11px;font-weight:300;color:rgba(255,205,184,0.55);letter-spacing:0.05em}

.doc-banner{background:var(--blush);padding:5rem;display:grid;grid-template-columns:1fr auto;align-items:center;gap:3rem;border-top:1px solid rgba(255,108,65,0.1)}
.doc-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,108,65,0.1);border:1px solid rgba(255,108,65,0.25);color:var(--orange);font-size:9px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;padding:6px 14px;border-radius:2px;margin-bottom:1.5rem}
.doc-badge-dot{width:5px;height:5px;border-radius:50%;background:var(--orange);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.doc-title{font-family:"Cormorant Garamond",serif;font-size:clamp(1.8rem,3vw,3rem);font-weight:300;color:var(--text-dark);line-height:1.15;margin-bottom:1rem}
.doc-title em{font-style:italic;color:var(--coral)}
.doc-sub{font-size:14px;font-weight:300;color:var(--text-mid);line-height:1.75;max-width:480px}
.yt-btn{display:flex;align-items:center;gap:10px;background:var(--orange);color:white;text-decoration:none;font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;padding:14px 28px;border-radius:2px;transition:background 0.2s;white-space:nowrap}
.yt-btn:hover{background:var(--ember)}

footer{background:var(--text-dark);padding:2.5rem 5rem;display:flex;align-items:center;justify-content:space-between}
.footer-wordmark{font-family:"Cormorant Garamond",serif;font-size:1.4rem;font-weight:300;color:rgba(255,205,184,0.4);text-decoration:none}
.footer-links{display:flex;gap:2rem;list-style:none}
.footer-links a{text-decoration:none;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,205,184,0.4);transition:color 0.2s}
.footer-links a:hover{color:var(--peach)}
.footer-copy{font-size:11px;color:rgba(255,205,184,0.25)}

@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.fade-up{opacity:0;animation:fadeUp 0.8s ease forwards}
.fd1{animation-delay:0.1s}.fd2{animation-delay:0.28s}.fd3{animation-delay:0.44s}.fd4{animation-delay:0.6s}

.leaflet-popup-content-wrapper{border-radius:4px!important;font-family:"DM Sans",sans-serif!important;box-shadow:0 8px 28px rgba(0,0,0,0.1)!important}
.leaflet-popup-content{margin:14px 16px!important}
.popup-type{font-size:9px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:#FF6C41;margin-bottom:4px}

.popup-link{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#FF6C41;text-decoration:none;border-bottom:1px solid #FF6C41;padding-bottom:1px}
</style>

<section class="manifesto">
  <div>
    <div class="section-eyebrow">Our Manifesto</div>
    <h2 class="manifesto-headline">
      This map is a love letter to the women who <em>built something anyway.</em>
    </h2>
    <div class="manifesto-body">
      <p>Not the ones who waited for permission. The ones who unlocked a door, hung a sign, and made a place that felt like theirs, and somehow in doing so, made it yours too.</p>
      <p>PinD exists because Google Maps will show you an address, but it will not tell you that you can exhale there. It will not tell you that the woman who owns that cafe sat at that counter for years before she put her name on the door.</p>
      <p>We are building a different kind of map. One made of stories, not listings. One that grows the same way trust does: slowly, personally, by word of mouth.</p>
    </div>
  </div>
  <div>
    <div class="pull-quote">
      Google Maps will show you an address. It will not tell you that you can exhale there.
    </div>
    <div class="value-list">
      <div class="value-item"><div class="value-dot"></div><div class="value-text">We map feeling, not just location. Safety, belonging, and the warmth of a space made with intention.</div></div>
      <div class="value-item"><div class="value-dot"></div><div class="value-text">We are not a directory. Every space here is a story, not a listing.</div></div>
      <div class="value-item"><div class="value-dot"></div><div class="value-text">Word of mouth is our oldest technology. PinD is its digital form.</div></div>
      <div class="value-item"><div class="value-dot"></div><div class="value-text">We start where we know. We grow only when it means growing well.</div></div>
    </div>
  </div>
</section>

const places=[
  {id:1,name:"Bombay Perfumery",area:"Kala Ghoda",type:"retail",lat:18.9281,lng:72.8312,desc:"A boutique fragrance studio where every scent tells a story. Owned and created entirely by women.",featured:true},
  {id:2,name:"The Yoga House",area:"Prabhadevi",type:"wellness",lat:19.0148,lng:72.8325,desc:"A sanctuary for mindful practice. A space where the door is always open.",featured:true},
  {id:3,name:"Araku Coffee",area:"Bandra",type:"cafe",lat:19.0596,lng:72.8295,desc:"Origin coffee from Araku Valley, brought to the city by a women-led cooperative.",featured:true},
  {id:4,name:"Nirmala's Kitchen",area:"Dharavi",type:"cafe",lat:19.0435,lng:72.8562,desc:"A home kitchen turned community table. Nirmala cooks what she grew up eating.",featured:true},
  {id:5,name:"Studio Kohl",area:"Worli",type:"studio",lat:19.0069,lng:72.8180,desc:"An art studio, darkroom, and gathering space for women who make things.",featured:true},
  {id:6,name:"The Ink Room",area:"Colaba",type:"workspace",lat:18.9067,lng:72.8147,desc:"A members writing room. Founded by two journalists who needed a room of their own.",featured:true},
  {id:7,name:"Saee's Flower Studio",area:"Juhu",type:"retail",lat:19.1075,lng:72.8263,desc:"Seasonal florals, grown with intention. No plastic, no waste, no shortcuts.",featured:false},
  {id:8,name:"Prana Wellness",area:"Andheri",type:"wellness",lat:19.1197,lng:72.8464,desc:"Integrative health clinic run entirely by women practitioners.",featured:false},
];
const typeColor={cafe:"#FF6C41",retail:"#7B2F25",studio:"#4A6B4A",wellness:"#B05878",workspace:"#4A6B8A"};

const hMap=L.map("hero-map",{center:[19.076,72.8777],zoom:12,zoomControl:false,scrollWheelZoom:false,dragging:false,attributionControl:false});
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png").addTo(hMap);
places.forEach(p=>{
  L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:"<div style='width:8px;height:8px;background:"+typeColor[p.type]+";border-radius:50%;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.2)'></div>",iconSize:[8,8],iconAnchor:[4,4]})}).addTo(hMap);
});

const mMap=L.map("main-map",{center:[19.05,72.84],zoom:12,scrollWheelZoom:false});
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{attribution:"&copy; OpenStreetMap &copy; CARTO"}).addTo(mMap);
let ml=L.layerGroup().addTo(mMap);

function renderMarkers(f){
  ml.clearLayers();
  (f==="all"?places:places.filter(p=>p.type===f)).forEach(p=>{
    const mk=L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:"<div style='width:13px;height:13px;background:"+typeColor[p.type]+";border-radius:50%;border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.22);cursor:pointer'></div>",iconSize:[13,13],iconAnchor:[6,6]})});
    mk.bindPopup("<div class='popup-type'>"+p.type+"</div><div class='popup-name'>"+p.name+"</div><div class='popup-area'>"+p.area+", Mumbai</div><a href='explore.html' class='popup-link'>View Details</a>",{maxWidth:200});
    mk.addTo(ml);
  });
}
renderMarkers("all");

function filterMap(type,btn){
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderMarkers(type);
}

document.getElementById("places-grid").innerHTML=places.filter(p=>p.featured).map(p=>`
  <a class="place-card" href="explore.html">
    <div class="place-type">${p.type}</div>
    <div class="place-name">${p.name}</div>
    <div class="place-area">${p.area}, Mumbai</div>
    <div class="place-desc">${p.desc}</div>
    <div class="place-footer"><span class="owner-badge">Women-Owned</span><span style="color:#B07060;font-size:14px">&#x2192;</span></div>
  </a>`).join("");

window.addEventListener("scroll",()=>{
  document.getElementById("navbar").classList.toggle("scrolled",window.scrollY>40);
});
document.querySelectorAll("a[href^='#']").forEach(a=>{
  a.addEventListener("click",e=>{
    const t=document.querySelector(a.getAttribute("href"));
    if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth"});}
  });
});
<\/script>
</body>
</html>
