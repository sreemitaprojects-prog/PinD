<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinD by Decoding Draupadi — Explore</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{--dd-red:#F0615C;--dd-pink:#FFACEC;--white:#FFFFFF;--black:#000000;--text-muted:#333333;--border:rgba(240,97,92,0.2);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:"Montserrat",sans-serif;background:var(--white);color:var(--black);}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:72px;background:var(--dd-red);border-bottom:1px solid rgba(0,0,0,0.08);}
.nav-logo{display:flex;align-items:center;text-decoration:none;}
.nav-logo-wrap{display:flex;flex-direction:column;gap:2px;}
.nav-logo-text{font-family:"Montserrat",sans-serif;font-size:1.5rem;font-weight:700;color:var(--white);line-height:1;}
.dd-initiative-tag{font-family:"Montserrat",sans-serif;font-size:11px;font-weight:600;color:var(--dd-pink);line-height:1.2;}
.nav-links{display:flex;align-items:center;gap:1.25rem;list-style:none;}
.nav-links a{text-decoration:none;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--white);transition:color 0.2s;font-family:"Montserrat",sans-serif;}
.nav-links a:hover{color:var(--dd-pink);}
.nav-cta{background:var(--white)!important;color:var(--dd-red)!important;padding:8px 20px;border-radius:5px;font-weight:700!important;}
.nav-cta:hover{background:var(--dd-pink)!important;color:var(--black)!important;}

/* LAYOUT */
.page{position:fixed;top:72px;left:0;right:0;bottom:0;display:flex;}
#map{position:absolute;inset:0;z-index:0;}

/* LEFT PANEL */
.panel{position:relative;z-index:10;width:400px;flex-shrink:0;display:flex;flex-direction:column;background:var(--dd-red);height:100%;overflow:hidden;}

/* PANEL TOP */
.panel-top{flex-shrink:0;padding:1.75rem 1.5rem 1.25rem;background:var(--dd-red);}
.panel-title{font-family:"Montserrat",sans-serif;font-size:1.55rem;font-weight:700;line-height:1.15;color:white;margin-bottom:1.1rem;}
.panel-title em{font-family:"Montserrat",sans-serif;font-style:italic;font-weight:400;color:var(--dd-pink);}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:1rem;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.6);pointer-events:none;}
#searchInput{width:100%;padding:0.65rem 1rem 0.65rem 2.5rem;border:1px solid rgba(255,255,255,0.25);border-radius:5px;font-family:"Montserrat",sans-serif;font-size:13px;color:white;background:rgba(255,255,255,0.15);outline:none;transition:border-color 0.2s,background 0.2s;cursor:pointer;}
#searchInput::placeholder{color:rgba(255,255,255,0.55);}
#searchInput:focus{border-color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.22);}

/* FILTER PILLS */
.filter-row{display:flex;gap:0.35rem;flex-wrap:wrap;margin-bottom:0.75rem;}
.filter-pill{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);color:rgba(255,255,255,0.8);font-family:"Montserrat",sans-serif;font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all 0.18s;}
.filter-pill:hover{background:rgba(255,255,255,0.22);color:white;}
.filter-pill.active{background:white;border-color:white;color:var(--dd-red);}

/* CITY PILLS */
.city-row{display:flex;gap:0.3rem;flex-wrap:wrap;padding:0 1.5rem 0.75rem;}
.city-pill{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.75);font-family:"Montserrat",sans-serif;font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:4px 11px;border-radius:20px;cursor:pointer;transition:all 0.18s;}
.city-pill:hover{background:rgba(255,255,255,0.2);color:white;}
.city-pill.active{background:var(--black);border-color:var(--black);color:white;}

/* NEIGH PILLS */
.neigh-row{display:flex;gap:0.3rem;flex-wrap:wrap;padding:0 1.5rem 0.75rem;border-bottom:1px solid rgba(255,255,255,0.1);}
.neigh-pill{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);font-family:"Montserrat",sans-serif;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border-radius:20px;cursor:pointer;transition:all 0.18s;}
.neigh-pill:hover{background:rgba(255,255,255,0.18);color:white;}
.neigh-pill.active{background:var(--black);border-color:var(--black);color:var(--dd-pink);}

/* RESULTS META */
.results-meta{padding:0.6rem 1.5rem;font-size:11px;color:rgba(255,255,255,0.55);letter-spacing:0.04em;font-family:"Montserrat",sans-serif;flex-shrink:0;}
.results-meta span{color:white;font-weight:600;}

/* CARDS SCROLL */
.cards-scroll{flex:1;overflow-y:auto;padding:0.5rem 1rem 2rem;background:var(--dd-red);}
.cards-scroll::-webkit-scrollbar{width:3px;}
.cards-scroll::-webkit-scrollbar-track{background:transparent;}
.cards-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:2px;}

/* FILTER TOGGLE */
.filter-toggle-btn{width:100%;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);color:white;font-family:"Montserrat",sans-serif;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:8px 14px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background 0.18s;margin-bottom:0;}
.filter-toggle-btn:hover{background:rgba(255,255,255,0.2);}
.filter-drawer{overflow:hidden;max-height:0;transition:max-height 0.35s ease;}
.filter-drawer.open{max-height:500px;}
.filter-drawer-inner{padding:0.75rem 1.5rem 0.25rem;}

/* PLACE CARDS — square grid */
.cards-scroll{flex:1;overflow-y:auto;padding:0.5rem 0.75rem 2rem;background:var(--dd-red);}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;}
.sq-card{background:white;border-radius:5px;padding:0.85rem 0.8rem;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;gap:0.2rem;border:2px solid transparent;text-decoration:none;color:inherit;min-height:110px;}
.sq-card:hover,.sq-card.active{border-color:var(--dd-pink);box-shadow:0 4px 16px rgba(0,0,0,0.12);}
.card-type{font-size:8px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--dd-red);font-family:"Montserrat",sans-serif;}
.card-name{font-family:"Montserrat",sans-serif;font-size:0.92rem;font-weight:700;line-height:1.2;color:var(--black);}
.card-area{font-size:9px;font-weight:400;color:var(--text-muted);font-family:"Montserrat",sans-serif;}
.card-note{font-size:10px;font-weight:400;line-height:1.5;color:#555;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-family:"Montserrat",sans-serif;margin-top:auto;padding-top:4px;}

/* EMPTY / LOADING */
.empty-state{text-align:center;padding:3rem 1.5rem;}
.empty-icon{font-size:2rem;margin-bottom:1rem;opacity:0.5;}
.empty-text{font-family:"Montserrat",sans-serif;font-size:1.15rem;font-weight:400;font-style:italic;color:rgba(255,255,255,0.6);}
.loading-state{text-align:center;padding:3rem 1.5rem;font-family:"Montserrat",sans-serif;font-size:1.1rem;font-style:italic;font-weight:400;color:rgba(255,255,255,0.6);}

/* SEARCH MODAL */
.search-modal{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;padding-top:120px;}
.search-modal.open{display:flex;}
.search-box{background:white;border-radius:5px;width:100%;max-width:560px;box-shadow:0 24px 60px rgba(0,0,0,0.18);overflow:hidden;}
.search-input-wrap{position:relative;border-bottom:1px solid var(--border);}
.search-input-icon{position:absolute;left:1.25rem;top:50%;transform:translateY(-50%);color:var(--text-muted);}
#modalSearchInput{width:100%;padding:1.1rem 1.25rem 1.1rem 3rem;font-family:"Montserrat",sans-serif;font-size:1rem;color:var(--black);border:none;outline:none;background:transparent;}
#modalSearchInput::placeholder{color:var(--text-muted);}
.search-results-list{max-height:400px;overflow-y:auto;}
.search-result-item{padding:0.9rem 1.25rem;cursor:pointer;transition:background 0.15s;border-bottom:1px solid rgba(240,97,92,0.08);display:flex;flex-direction:column;gap:3px;}
.search-result-item:hover{background:rgba(255,172,236,0.2);}
.sr-name{font-family:"Montserrat",sans-serif;font-size:1rem;font-weight:700;color:var(--black);}
.sr-meta{font-size:11px;color:var(--text-muted);font-family:"Montserrat",sans-serif;}
.search-empty{padding:2rem 1.25rem;font-family:"Montserrat",sans-serif;font-size:1rem;font-style:italic;font-weight:400;color:var(--text-muted);text-align:center;}
.search-close{padding:0.75rem 1.25rem;border-top:1px solid var(--border);font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);text-align:center;cursor:pointer;font-family:"Montserrat",sans-serif;transition:color 0.2s;}
.search-close:hover{color:var(--dd-red);}

/* MODAL OVERLAY */
.modal-overlay{display:none;position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:1.5rem;}
.modal-overlay.open{display:flex;}
.modal-card{background:white;border-radius:10px;width:100%;max-width:400px;max-height:72vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,0.25);position:relative;animation:modalIn 0.22s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(0.94);}to{opacity:1;transform:scale(1);}}
.detail-close{position:absolute;top:0.75rem;right:0.75rem;width:30px;height:30px;border-radius:50%;background:var(--dd-red);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-size:0.82rem;transition:background 0.2s,color 0.2s;z-index:2;font-family:"Montserrat",sans-serif;}
.detail-close:hover{background:var(--dd-pink);color:var(--black);}
.detail-scroll{flex:1;overflow-y:auto;padding:1.5rem 1.5rem 2rem;}
.detail-scroll::-webkit-scrollbar{width:3px;}
.detail-scroll::-webkit-scrollbar-thumb{background:rgba(240,97,92,0.2);border-radius:2px;}
.detail-note{font-family:"Montserrat",sans-serif;font-size:1.05rem;font-weight:400;font-style:italic;line-height:1.7;color:var(--black);margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border);}
.detail-name{font-family:"Montserrat",sans-serif;font-size:1.5rem;font-weight:700;color:var(--black);line-height:1.1;margin-bottom:0.35rem;}
.detail-area{font-size:11px;font-weight:400;color:var(--text-muted);font-family:"Montserrat",sans-serif;display:flex;align-items:center;gap:5px;margin-bottom:1rem;}
.detail-area::before{content:"📍";font-size:10px;}
.detail-type{display:inline-block;font-size:9px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--dd-red);background:rgba(240,97,92,0.08);padding:4px 10px;border-radius:4px;margin-bottom:1.25rem;font-family:"Montserrat",sans-serif;}
.detail-insta{display:inline-flex;align-items:center;gap:8px;color:var(--dd-red);text-decoration:none;font-size:13px;font-family:"Montserrat",sans-serif;border-bottom:1px solid rgba(240,97,92,0.3);padding-bottom:2px;transition:color 0.2s;}
.detail-insta:hover{color:var(--black);}
.detail-badge{font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--dd-red);background:rgba(240,97,92,0.06);padding:8px 14px;border-radius:4px;display:inline-block;font-family:"Montserrat",sans-serif;}

.map-hint{position:absolute;bottom:1.5rem;right:1.5rem;z-index:10;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:5px;padding:0.6rem 1rem;font-size:11px;color:var(--text-muted);letter-spacing:0.04em;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.08);font-family:"Montserrat",sans-serif;}

.leaflet-popup-content-wrapper{border-radius:5px!important;font-family:"Montserrat",sans-serif!important;box-shadow:0 8px 28px rgba(0,0,0,0.1)!important;border:1px solid var(--border)!important;}
.leaflet-popup-content{margin:12px 14px!important;}
.popup-name{font-family:"Montserrat",sans-serif;font-size:1rem;font-weight:700;color:#000;margin-bottom:2px;}
.popup-area{font-size:10px;color:#333;}

@media(max-width:768px){
  nav{padding:0 1.25rem;height:64px;}
  .nav-logo-text{font-size:1.3rem;}
  .dd-initiative-tag{font-size:10px;}
  .nav-links a{font-size:10px;}
  .nav-cta{padding:7px 14px;}
  .page{top:64px;}

  /* Panel slides up from bottom on mobile */
  .panel{
    position:fixed;bottom:0;left:0;right:0;top:auto;
    width:100%;height:52vh;
    border-right:none;
    border-top:1px solid rgba(255,255,255,0.2);
    border-radius:14px 14px 0 0;
    z-index:20;
  }
  .panel-top{padding:1rem 1rem 0.65rem;}
  .panel-title{font-size:1.15rem;margin-bottom:0.65rem;}
  .filter-pill{font-size:9px;padding:4px 9px;}
  .city-row{padding:0 1rem 0.5rem;}
  .city-pill{font-size:9px;padding:3px 9px;}
  .neigh-row{padding:0.4rem 1rem;}
  .neigh-pill{font-size:9px;padding:3px 8px;}
  .results-meta{padding:0.4rem 1rem;}
  .cards-scroll{padding:0.4rem 0.75rem 5rem;}
  .place-card{padding:0.8rem 0.9rem;}
  .card-name{font-size:0.9rem;}

  /* Detail panel full screen on mobile */
  .detail-panel{width:100%;border-left:none;}
  .detail-scroll{padding:1.5rem 1.25rem 3rem;}
  .detail-name{font-size:1.5rem;}
  .detail-note{font-size:1rem;}

  .map-hint{display:none;}
  .search-box{margin:0 0.75rem;}
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html" aria-label="PinD Home">
    <div class="nav-logo-wrap">
      <span class="nav-logo-text">PinD</span>
      <span class="dd-initiative-tag">A Decoding Draupadi Initiative</span>

<div class="page">
  <div id="map"></div>

  <!-- LEFT PANEL -->
  <div class="panel">

      <div class="panel-title">Every pin is a woman<br>who <em>built something.</em></div>
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name or area…" readonly onclick="openSearch()">
      </div>
      <button class="filter-toggle-btn" onclick="toggleFilters()" id="filterToggleBtn">

      </div>

  </div>

  <div class="map-hint">Click a pin to explore</div>

  <!-- MODAL OVERLAY -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal-card" id="detailPanel">
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div class="detail-scroll">
      <!-- PHOTOS -->
      <div id="dPhotos" style="display:none;margin-bottom:1.5rem;">
        <div style="display:flex;gap:0.6rem;height:130px;">
          <div id="dOwnerPhotoWrap" style="flex:1;border-radius:3px;overflow:hidden;display:none;">
            <img id="dOwnerPhoto" src="" alt="Owner" style="width:100%;height:100%;object-fit:cover;display:block;">
          </div>
          <div id="dSpacePhotoWrap" style="flex:1;border-radius:3px;overflow:hidden;display:none;">
            <img id="dSpacePhoto" src="" alt="Space" style="width:100%;height:100%;object-fit:cover;display:block;">
          </div>
        </div>
      </div>
      <div class="detail-note" id="dNote"></div>
      <div class="detail-name" id="dName"></div>
      <div class="detail-area" id="dArea"></div>
      <div class="detail-type" id="dType"></div>
      <div id="dInstaWrap"></div>
      <div style="margin-top:2rem;"><span class="detail-badge">Women-Owned</span></div>
      <div style="margin-top:1.25rem;"><a id="dFullLink" href="#" style="font-size:0.8rem;font-weight:700;color:var(--dd-red);text-decoration:none;letter-spacing:0.04em;font-family:'Montserrat',sans-serif;">View full profile →</a></div>
    </div>
  </div>
  </div>
</div>

<!-- SEARCH MODAL -->
<div class="search-modal" id="searchModal" onclick="handleSearchOverlay(event)">
  <div class="search-box">
    <div class="search-input-wrap">
      <svg class="search-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="modalSearchInput" placeholder="Search by name, area or city…" oninput="runSearch()" autofocus>
    </div>
    <div class="search-results-list" id="searchResultsList"></div>
    <div class="search-close" onclick="closeSearch()">Close search</div>
  </div>
</div>

<script>
function slugify(str){return(str||'').toLowerCase().replace(/[^\w\s-]/g,'').replace(/[\s_]+/g,'-').replace(/^-+|-+$/g,'');}
const SUPABASE_URL='https://xyzgqmghddzirnafwodi.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5emdxbWdoZGR6aXJuYWZ3b2RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NTM2MTcsImV4cCI6MjA5NTUyOTYxN30.4laPWa2_obOOAkTeFWDg4FGI9LDKDrHcY9pZlWAaAlo';

const cityCoords={
  Mumbai:{center:[19.05,72.87],zoom:12},
  Delhi:{center:[28.61,77.22],zoom:12},
  Bangalore:{center:[12.95,77.60],zoom:12},
  Kolkata:{center:[22.56,88.36],zoom:12},
  Hyderabad:{center:[17.42,78.43],zoom:12},
  Pune:{center:[18.52,73.86],zoom:12},
  Goa:{center:[15.50,73.82],zoom:12},
  Noida:{center:[28.57,77.32],zoom:12},
  Gurgaon:{center:[28.47,77.09],zoom:12},
};

function getTypeColor(t){return '#F0615C';}

let allPlaces=[];
let activeCity='Mumbai';
let activeCategory='all';
let activeNeigh='all';
let activeCardId=null;
let markers={};

// MAP
const map=L.map('map',{center:[19.05,72.87],zoom:12,zoomControl:false,attributionControl:false});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);

// FETCH FROM SUPABASE
async function fetchPlaces(){
  document.getElementById('cardsScroll').innerHTML='<div class="loading-state">Finding spaces…</div>';
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/submissions?status=eq.approved&select=*',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    if(!res.ok)throw new Error('fetch failed');
    const raw=await res.json();
    // normalise field names
    allPlaces=raw.map((p,i)=>({
      id:p.id||i,
      name:p.space_name||'Unnamed',
      city:p.city||'Mumbai',
      area:p.neighbourhood||'',
      type:(p.category||'other').toLowerCase(),
      lat:parseFloat(p.lat)||null,
      lng:parseFloat(p.lng)||null,
      note:p.personal_note||'',
      instagram:p.space_instagram||'',
      owner:p.owner_name||'',
      ownerPhoto:p.owner_photo_url||'',
      spacePhoto:p.space_photo_url||'',
    }));
  }catch(e){
    allPlaces=[];
  }
  await geocodeAll(allPlaces);
  buildUI();
}

function buildUI(){
  buildCityPills();
  buildNeighPills();
  buildMarkers();
  applyFilters();
}

// CITY PILLS
function buildCityPills(){
  const row=document.getElementById('cityRow');
  row.innerHTML='';
  const cities=Object.keys(cityCoords);
  cities.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='city-pill'+(c===activeCity?' active':'');
    btn.textContent=c;
    btn.onclick=()=>setCity(c,btn);
    row.appendChild(btn);
  });
}

// NEIGH PILLS
function buildNeighPills(){
  const row=document.getElementById('neighRow');
  row.innerHTML='';
  const allBtn=document.createElement('button');
  allBtn.className='neigh-pill active';
  allBtn.textContent='All areas';
  allBtn.onclick=()=>setNeigh('all',allBtn);
  row.appendChild(allBtn);
  const neighs=[...new Set(allPlaces.filter(p=>p.city===activeCity).map(p=>p.area))].filter(Boolean).sort();
  neighs.forEach(n=>{
    const btn=document.createElement('button');
    btn.className='neigh-pill';
    btn.textContent=n;
    btn.onclick=()=>setNeigh(n,btn);
    row.appendChild(btn);
  });
}

// MARKERS
function buildMarkers(){
  Object.values(markers).forEach(m=>{if(map.hasLayer(m))map.removeLayer(m);});
  markers={};
  allPlaces.forEach(p=>{
    if(!p.lat||!p.lng)return;
    const icon=L.divIcon({className:'',html:'<svg width="22" height="30" viewBox="0 0 22 30" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));cursor:pointer"><path d="M11 0C4.925 0 0 4.925 0 11c0 8.25 11 19 11 19s11-10.75 11-19C22 4.925 17.075 0 11 0z" fill="#F0615C"/><circle cx="11" cy="11" r="4.5" fill="white"/></svg>',iconSize:[22,30],iconAnchor:[11,30]});
    const mk=L.marker([p.lat,p.lng],{icon});
    mk.on('click',()=>openDetail(p.id));
    markers[p.id]=mk;
  });
}

function setCity(city,btn){
  activeCity=city;activeNeigh='all';activeCategory='all';
  document.querySelectorAll('.city-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));
  document.querySelector('.filter-pill').classList.add('active');
  buildNeighPills();
  const cv=cityCoords[city];
  map.flyTo(cv.center,cv.zoom,{duration:1.2});
  updateFilterSummary();
  applyFilters();
}

function setCategory(cat,btn){
  activeCategory=cat;
  document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  updateFilterSummary();
  applyFilters();
}

function setNeigh(n,btn){
  activeNeigh=n;
  document.querySelectorAll('.neigh-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters(){
  const filtered=allPlaces.filter(p=>{
    const matchCity=p.city===activeCity;
    const matchCat=activeCategory==='all'||p.type.includes(activeCategory);
    const matchNeigh=activeNeigh==='all'||p.area===activeNeigh;
    return matchCity&&matchCat&&matchNeigh;
  });
  renderCards(filtered);
  renderMarkers(filtered);
}

function renderMarkers(filtered){
  const ids=new Set(filtered.map(p=>p.id));
  allPlaces.forEach(p=>{
    const mk=markers[p.id];
    if(!mk)return;
    if(ids.has(p.id)){if(!map.hasLayer(mk))mk.addTo(map);}
    else{if(map.hasLayer(mk))map.removeLayer(mk);}
  });
}

function renderCards(filtered){
  const meta=document.getElementById('resultsMeta');
  const scroll=document.getElementById('cardsScroll');
  meta.innerHTML='<span>'+filtered.length+'</span> space'+(filtered.length!==1?'s':'')+' found in '+activeCity;
  if(filtered.length===0){
    scroll.innerHTML='<div class="empty-state"><div class="empty-icon">📍</div><div class="empty-text">No spaces found yet.<br>Be the first to pin one.</div></div>';
    return;
  }
  scroll.innerHTML='<div class="cards-grid">'+filtered.map(p=>`
    <a class="sq-card${activeCardId===p.id?' active':''}" id="card-${p.id}" href="/${slugify(p.name)}" onclick="handleCardClick(event,'${p.id}')">
      <div class="card-type">${p.type}</div>
      <div class="card-name">${p.name}</div>
      <div class="card-area">${p.area}${p.city?', '+p.city:''}</div>
      ${p.note?'<div class="card-note">'+p.note+'</div>':''}
    </a>
  `).join('')+'</div>';
}

function openDetail(id){
  activeCardId=id;
  const p=allPlaces.find(x=>x.id===id);
  if(!p)return;
  document.getElementById('dNote').textContent=p.note||'No note provided yet.';
  document.getElementById('dName').textContent=p.name;
  document.getElementById('dArea').textContent=(p.area?p.area+', ':'')+p.city;
  document.getElementById('dType').textContent=p.type;

  // photos
  const photosWrap=document.getElementById('dPhotos');
  const ownerWrap=document.getElementById('dOwnerPhotoWrap');
  const spaceWrap=document.getElementById('dSpacePhotoWrap');
  if(p.ownerPhoto||p.spacePhoto){
    photosWrap.style.display='block';
    if(p.ownerPhoto){ownerWrap.style.display='block';document.getElementById('dOwnerPhoto').src=p.ownerPhoto;}
    else{ownerWrap.style.display='none';}
    if(p.spacePhoto){spaceWrap.style.display='block';document.getElementById('dSpacePhoto').src=p.spacePhoto;}
    else{spaceWrap.style.display='none';}
  }else{photosWrap.style.display='none';}

  const instaWrap=document.getElementById('dInstaWrap');
  if(p.instagram){
    const raw=p.instagram.trim();
    const href=raw.startsWith('http')?raw:'https://instagram.com/'+raw.replace('@','');
    instaWrap.innerHTML='<a class="detail-insta" href="'+href+'" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg> Find more here!</a>';
  }else{instaWrap.innerHTML='';}
  document.getElementById('dFullLink').href='/'+slugify(p.name);
  history.pushState({spaceId:p.id},'','/'+slugify(p.name));
  document.getElementById('modalOverlay').classList.add('open');
  document.querySelectorAll('.sq-card').forEach(c=>c.classList.remove('active'));
  const card=document.getElementById('card-'+id);
  if(card){card.classList.add('active');card.scrollIntoView({behavior:'smooth',block:'nearest'});}
  if(markers[id]&&p.lat&&p.lng){map.flyTo([p.lat,p.lng],15,{duration:0.8});markers[id].openPopup();}
}

function handleCardClick(e,id){
  e.preventDefault();
  openDetail(id);
}

function closeDetail(){
  document.getElementById('modalOverlay').classList.remove('open');
  activeCardId=null;
  document.querySelectorAll('.sq-card').forEach(c=>c.classList.remove('active'));
  history.pushState(null,'','/explore.html');
}
function handleOverlayClick(e){if(e.target===document.getElementById('modalOverlay'))closeDetail();}
window.addEventListener('popstate',()=>{closeDetail();});

// SEARCH MODAL
function openSearch(){
  document.getElementById('searchModal').classList.add('open');
  setTimeout(()=>document.getElementById('modalSearchInput').focus(),50);
  renderSearchResults('');
}

function closeSearch(){
  document.getElementById('searchModal').classList.remove('open');
  document.getElementById('modalSearchInput').value='';
}

function handleSearchOverlay(e){
  if(e.target===document.getElementById('searchModal'))closeSearch();
}

function runSearch(){
  const q=document.getElementById('modalSearchInput').value.trim();
  renderSearchResults(q);
}

function renderSearchResults(q){
  const list=document.getElementById('searchResultsList');
  const filtered=q
    ?allPlaces.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())||p.area.toLowerCase().includes(q.toLowerCase())||p.city.toLowerCase().includes(q.toLowerCase()))
    :allPlaces.slice(0,12);
  if(filtered.length===0){
    list.innerHTML='<div class="search-empty">No spaces found for "'+q+'"</div>';
    return;
  }
  list.innerHTML=filtered.map(p=>`
    <div class="search-result-item" onclick="selectFromSearch('${p.id}')">
      <div class="sr-name">${p.name}</div>
      <div class="sr-meta">${p.area?p.area+', ':''}${p.city} &middot; ${p.type}</div>
    </div>
  `).join('');
}

function selectFromSearch(id){
  closeSearch();
  // switch to correct city first
  const p=allPlaces.find(x=>x.id===id);
  if(!p)return;
  if(p.city!==activeCity){
    const cityBtn=[...document.querySelectorAll('.city-pill')].find(b=>b.textContent===p.city);
    if(cityBtn)setCity(p.city,cityBtn);
  }
  setTimeout(()=>openDetail(id),200);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();closeDetail();}});

// FILTER TOGGLE
let filtersOpen=false;
function toggleFilters(){
  filtersOpen=!filtersOpen;
  document.getElementById('filterDrawer').classList.toggle('open',filtersOpen);
  document.getElementById('filterChevron').style.transform=filtersOpen?'rotate(180deg)':'';
}
function updateFilterSummary(){
  const cat=activeCategory==='all'?'All':activeCategory;
  document.getElementById('filterSummary').textContent=activeCity+' · '+cat;
}

// GEOCODING
const geocodeCache={};
async function geocodeAll(places){
  const seen=new Set();
  const toGeocode=[];
  places.forEach(p=>{
    const key=((p.area||'')+','+(p.city||'')).toLowerCase();
    if(!seen.has(key)){seen.add(key);toGeocode.push({key,area:p.area,city:p.city});}
  });
  for(let i=0;i<toGeocode.length;i++){
    const{key,area,city}=toGeocode[i];
    if(geocodeCache[key])continue;
    try{
      const q=encodeURIComponent([area,city,'India'].filter(Boolean).join(', '));
      const res=await fetch('https://nominatim.openstreetmap.org/search?q='+q+'&format=json&limit=1',{headers:{'Accept-Language':'en','User-Agent':'PinD/1.0'}});
      const data=await res.json();
      if(data&&data.length)geocodeCache[key]={lat:parseFloat(data[0].lat),lng:parseFloat(data[0].lon)};
    }catch(e){}
    if(i<toGeocode.length-1)await new Promise(r=>setTimeout(r,1100));
  }
  places.forEach(p=>{
    const key=((p.area||'')+','+(p.city||'')).toLowerCase();
    if(geocodeCache[key]){
      p.lat=geocodeCache[key].lat+(Math.random()-0.5)*0.002;
      p.lng=geocodeCache[key].lng+(Math.random()-0.5)*0.002;
    }
  });
}

window.addEventListener('load',fetchPlaces);
</script>
