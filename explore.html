<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore — PinD</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='fg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FF6C41'/%3E%3Cstop offset='100%25' stop-color='%23FF3C2D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 2C10.477 2 6 6.477 6 12c0 7.5 10 18 10 18s10-10.5 10-18c0-5.523-4.477-10-10-10z' fill='url(%23fg)'/%3E%3Ccircle cx='16' cy='12' r='3.5' fill='white'/%3E%3C/svg%3E">
<style>
:root{--orange:#FF6C41;--coral:#FF3C2D;--ember:#7B2F25;--peach:#FFCDB8;--blush:#FFF0EC;--cream:#FFFAF7;--text-dark:#1C0A06;--text-mid:#5C2D1E;--text-light:#B07060;--border:rgba(255,108,65,0.14);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:"Karla",sans-serif;background:var(--cream);color:var(--text-dark);}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:60px;background:rgba(255,250,247,0.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,108,65,0.12);}
.nav-logo{display:flex;align-items:center;text-decoration:none;}
.nav-logo svg{height:34px;width:auto;}
.nav-links{display:flex;align-items:center;gap:1.25rem;list-style:none;}
.nav-links a{text-decoration:none;font-size:11px;font-weight:400;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-mid);transition:color 0.2s;font-family:"Karla",sans-serif;}
.nav-links a:hover{color:var(--orange);}
.nav-cta{background:var(--orange)!important;color:white!important;padding:8px 20px;border-radius:2px;}
.nav-cta:hover{background:var(--ember)!important;}

/* LAYOUT */
.page{position:fixed;top:60px;left:0;right:0;bottom:0;display:flex;}
#map{position:absolute;inset:0;z-index:0;}

/* LEFT PANEL */
.panel{position:relative;z-index:10;width:400px;flex-shrink:0;display:flex;flex-direction:column;background:var(--orange);height:100%;overflow:hidden;}

/* PANEL TOP — fixed orange header */
.panel-top{flex-shrink:0;padding:1.75rem 1.5rem 1.25rem;background:var(--orange);}
.panel-title{font-family:"Fraunces",serif;font-size:1.55rem;font-weight:300;line-height:1.15;color:white;margin-bottom:1.1rem;}
.panel-title em{font-style:italic;color:rgba(255,255,255,0.75);}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:1rem;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.6);pointer-events:none;}
#searchInput{width:100%;padding:0.65rem 1rem 0.65rem 2.5rem;border:1px solid rgba(255,255,255,0.25);border-radius:2px;font-family:"Karla",sans-serif;font-size:13px;color:white;background:rgba(255,255,255,0.15);outline:none;transition:border-color 0.2s,background 0.2s;cursor:pointer;}
#searchInput::placeholder{color:rgba(255,255,255,0.55);}
#searchInput:focus{border-color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.22);}

/* FILTER PILLS */
.filter-row{display:flex;gap:0.35rem;flex-wrap:wrap;margin-bottom:0.75rem;}
.filter-pill{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);color:rgba(255,255,255,0.8);font-family:"Karla",sans-serif;font-size:10px;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all 0.18s;}
.filter-pill:hover{background:rgba(255,255,255,0.22);color:white;}
.filter-pill.active{background:white;border-color:white;color:var(--orange);}

/* CITY PILLS */
.city-row{display:flex;gap:0.3rem;flex-wrap:wrap;padding:0 1.5rem 0.75rem;}
.city-pill{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.75);font-family:"Karla",sans-serif;font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:4px 11px;border-radius:20px;cursor:pointer;transition:all 0.18s;}
.city-pill:hover{background:rgba(255,255,255,0.2);color:white;}
.city-pill.active{background:var(--ember);border-color:var(--ember);color:white;}

/* NEIGH PILLS */
.neigh-row{display:flex;gap:0.3rem;flex-wrap:wrap;padding:0 1.5rem 0.75rem;border-bottom:1px solid rgba(255,255,255,0.1);}
.neigh-pill{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);font-family:"Karla",sans-serif;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border-radius:20px;cursor:pointer;transition:all 0.18s;}
.neigh-pill:hover{background:rgba(255,255,255,0.18);color:white;}
.neigh-pill.active{background:var(--ember);border-color:var(--ember);color:var(--peach);}

/* RESULTS META */
.results-meta{padding:0.6rem 1.5rem;font-size:11px;color:rgba(255,255,255,0.55);letter-spacing:0.04em;font-family:"Karla",sans-serif;flex-shrink:0;}
.results-meta span{color:white;font-weight:500;}

/* CARDS SCROLL */
.cards-scroll{flex:1;overflow-y:auto;padding:0.5rem 1rem 2rem;background:var(--orange);}
.cards-scroll::-webkit-scrollbar{width:3px;}
.cards-scroll::-webkit-scrollbar-track{background:transparent;}
.cards-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:2px;}

/* PLACE CARD */
.place-card{background:white;border-radius:3px;padding:1.1rem 1.2rem;margin-bottom:0.6rem;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;gap:0.3rem;border:2px solid transparent;}
.place-card:hover,.place-card.active{border-color:var(--ember);box-shadow:0 4px 16px rgba(123,47,37,0.12);}
.card-type{font-size:8px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--orange);font-family:"Karla",sans-serif;}
.card-name{font-family:"Fraunces",serif;font-size:1.1rem;font-weight:400;line-height:1.2;color:var(--text-dark);}
.card-area{font-size:10px;font-weight:300;color:var(--text-light);font-family:"Karla",sans-serif;display:flex;align-items:center;gap:4px;}
.card-area::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--orange);display:inline-block;opacity:0.6;}
.card-note{font-size:11.5px;font-weight:300;line-height:1.6;color:var(--text-mid);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:"Karla",sans-serif;margin-top:2px;}

/* EMPTY / LOADING */
.empty-state{text-align:center;padding:3rem 1.5rem;}
.empty-icon{font-size:2rem;margin-bottom:1rem;opacity:0.5;}
.empty-text{font-family:"Fraunces",serif;font-size:1.15rem;font-weight:300;font-style:italic;color:rgba(255,255,255,0.6);}
.loading-state{text-align:center;padding:3rem 1.5rem;font-family:"Fraunces",serif;font-size:1.1rem;font-style:italic;font-weight:300;color:rgba(255,255,255,0.6);}

/* SEARCH MODAL */
.search-modal{display:none;position:fixed;inset:0;z-index:3000;background:rgba(28,10,6,0.6);backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;padding-top:120px;}
.search-modal.open{display:flex;}
.search-box{background:white;border-radius:4px;width:100%;max-width:560px;box-shadow:0 24px 60px rgba(28,10,6,0.18);overflow:hidden;}
.search-input-wrap{position:relative;border-bottom:1px solid var(--border);}
.search-input-icon{position:absolute;left:1.25rem;top:50%;transform:translateY(-50%);color:var(--text-light);}
#modalSearchInput{width:100%;padding:1.1rem 1.25rem 1.1rem 3rem;font-family:"Karla",sans-serif;font-size:1rem;color:var(--text-dark);border:none;outline:none;background:transparent;}
#modalSearchInput::placeholder{color:var(--text-light);}
.search-results-list{max-height:400px;overflow-y:auto;}
.search-result-item{padding:0.9rem 1.25rem;cursor:pointer;transition:background 0.15s;border-bottom:1px solid rgba(255,108,65,0.07);display:flex;flex-direction:column;gap:3px;}
.search-result-item:hover{background:var(--blush);}
.sr-name{font-family:"Fraunces",serif;font-size:1rem;font-weight:400;color:var(--text-dark);}
.sr-meta{font-size:11px;color:var(--text-light);font-family:"Karla",sans-serif;}
.search-empty{padding:2rem 1.25rem;font-family:"Fraunces",serif;font-size:1rem;font-style:italic;font-weight:300;color:var(--text-light);text-align:center;}
.search-close{padding:0.75rem 1.25rem;border-top:1px solid var(--border);font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-light);text-align:center;cursor:pointer;font-family:"Karla",sans-serif;transition:color 0.2s;}
.search-close:hover{color:var(--orange);}

/* DETAIL PANEL (slide in from right) */
.detail-panel{position:absolute;top:0;right:0;bottom:0;width:380px;z-index:20;background:var(--cream);border-left:1px solid rgba(255,108,65,0.12);box-shadow:-8px 0 32px rgba(28,10,6,0.1);transform:translateX(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;overflow:hidden;}
.detail-panel.open{transform:translateX(0);}
.detail-close{position:absolute;top:1.1rem;right:1.1rem;width:32px;height:32px;border-radius:50%;background:var(--orange);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;transition:background 0.2s;z-index:2;font-family:"Karla",sans-serif;}
.detail-close:hover{background:var(--coral);}
.detail-scroll{flex:1;overflow-y:auto;padding:2rem 1.75rem 3rem;}
.detail-scroll::-webkit-scrollbar{width:3px;}
.detail-scroll::-webkit-scrollbar-thumb{background:rgba(255,108,65,0.2);border-radius:2px;}
.detail-note{font-family:"Fraunces",serif;font-size:1.25rem;font-weight:300;font-style:italic;line-height:1.7;color:var(--text-mid);margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(255,108,65,0.1);}
.detail-name{font-family:"Fraunces",serif;font-size:1.85rem;font-weight:300;color:var(--text-dark);line-height:1.1;margin-bottom:0.4rem;}
.detail-area{font-size:12px;font-weight:300;color:var(--text-light);font-family:"Karla",sans-serif;display:flex;align-items:center;gap:5px;margin-bottom:1.25rem;}
.detail-area::before{content:"📍";font-size:10px;}
.detail-type{display:inline-block;font-size:9px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--ember);background:rgba(123,47,37,0.07);padding:4px 10px;border-radius:2px;margin-bottom:1.5rem;font-family:"Karla",sans-serif;}
.detail-insta{display:inline-flex;align-items:center;gap:8px;color:var(--orange);text-decoration:none;font-size:13px;font-family:"Karla",sans-serif;border-bottom:1px solid rgba(255,108,65,0.3);padding-bottom:2px;transition:color 0.2s;}
.detail-insta:hover{color:var(--coral);}
.detail-badge{margin-top:2rem;padding-top:1.5rem;border-top:1px solid rgba(255,108,65,0.08);font-size:9px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;color:var(--ember);background:rgba(123,47,37,0.06);padding:8px 14px;border-radius:2px;display:inline-block;font-family:"Karla",sans-serif;}

.map-hint{position:absolute;bottom:1.5rem;right:1.5rem;z-index:10;background:rgba(255,250,247,0.95);backdrop-filter:blur(10px);border:1px solid rgba(255,108,65,0.15);border-radius:3px;padding:0.6rem 1rem;font-size:11px;color:var(--text-mid);letter-spacing:0.04em;pointer-events:none;box-shadow:0 4px 16px rgba(123,47,37,0.08);font-family:"Karla",sans-serif;}

.leaflet-popup-content-wrapper{border-radius:3px!important;font-family:"Karla",sans-serif!important;box-shadow:0 8px 28px rgba(0,0,0,0.1)!important;border:1px solid rgba(255,108,65,0.15)!important;}
.leaflet-popup-content{margin:12px 14px!important;}
.popup-name{font-family:"Fraunces",serif;font-size:1rem;font-weight:400;color:#1C0A06;margin-bottom:2px;}
.popup-area{font-size:10px;color:#B07060;}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html" aria-label="PinD Home">
    <svg height="34" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF6C41"/><stop offset="100%" stop-color="#FF3C2D"/></linearGradient></defs>
      <text x="4" y="68" font-family="Fraunces, serif" font-size="72" font-style="italic" font-weight="300" fill="url(#ng)">PinD</text>
      <g transform="translate(72, 2)"><path d="M9 0C5.686 0 3 2.686 3 6c0 4.5 6 11 6 11s6-6.5 6-11C15 2.686 12.314 0 9 0z" fill="url(#ng)"/><circle cx="9" cy="6" r="2.2" fill="white"/></g>
    </svg>
  </a>
  <ul class="nav-links">
    <li><a href="explore.html">Explore</a></li>
    <li><a href="form.html" class="nav-cta">PinIt</a></li>
  </ul>
</nav>

<div class="page">
  <div id="map"></div>

  <!-- LEFT PANEL -->
  <div class="panel">
    <div class="panel-top">
      <div class="panel-title">Every pin is a woman<br>who <em>built something.</em></div>
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name or area…" readonly onclick="openSearch()">
      </div>
      <div class="filter-row">
        <button class="filter-pill active" onclick="setCategory('all',this)">All</button>
        <button class="filter-pill" onclick="setCategory('cafe',this)">Cafe & Food</button>
        <button class="filter-pill" onclick="setCategory('studio',this)">Studios</button>
        <button class="filter-pill" onclick="setCategory('retail',this)">Retail</button>
        <button class="filter-pill" onclick="setCategory('wellness',this)">Wellness</button>
        <button class="filter-pill" onclick="setCategory('workspace',this)">Workspaces</button>
      </div>
    </div>
    <div class="city-row" id="cityRow"></div>
    <div class="neigh-row" id="neighRow"></div>
    <div class="results-meta" id="resultsMeta"></div>
    <div class="cards-scroll" id="cardsScroll"></div>
  </div>

  <div class="map-hint">Click a pin to explore</div>

  <!-- DETAIL PANEL -->
  <div class="detail-panel" id="detailPanel">
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div class="detail-scroll">
      <!-- PHOTOS -->
      <div id="dPhotos" style="display:none;margin-bottom:1.5rem;">
        <div style="display:flex;gap:0.6rem;height:180px;">
          <div id="dOwnerPhotoWrap" style="flex:1;border-radius:3px;overflow:hidden;display:none;">
            <img id="dOwnerPhoto" src="" alt="Owner" style="width:100%;height:100%;object-fit:cover;display:block;">
          </div>
          <div id="dSpacePhotoWrap" style="flex:1;border-radius:3px;overflow:hidden;display:none;">
            <img id="dSpacePhoto" src="" alt="Space" style="width:100%;height:100%;object-fit:cover;display:block;">
          </div>
        </div>
      </div>
      <div class="detail-note" id="dNote"></div>
      <div class="detail-name" id="dName"></div>
      <div class="detail-area" id="dArea"></div>
      <div class="detail-type" id="dType"></div>
      <div id="dInstaWrap"></div>
      <div style="margin-top:2rem;"><span class="detail-badge">Women-Owned</span></div>
    </div>
  </div>
</div>

<!-- SEARCH MODAL -->
<div class="search-modal" id="searchModal" onclick="handleSearchOverlay(event)">
  <div class="search-box">
    <div class="search-input-wrap">
      <svg class="search-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="modalSearchInput" placeholder="Search by name, area or city…" oninput="runSearch()" autofocus>
    </div>
    <div class="search-results-list" id="searchResultsList"></div>
    <div class="search-close" onclick="closeSearch()">Close search</div>
  </div>
</div>

<script>
const SUPABASE_URL='https://xyzgqmghddzirnafwodi.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5emdxbWdoZGR6aXJuYWZ3b2RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NTM2MTcsImV4cCI6MjA5NTUyOTYxN30.4laPWa2_obOOAkTeFWDg4FGI9LDKDrHcY9pZlWAaAlo';

const cityCoords={
  Mumbai:{center:[19.05,72.87],zoom:12},
  Delhi:{center:[28.61,77.22],zoom:12},
  Bangalore:{center:[12.95,77.60],zoom:12},
  Kolkata:{center:[22.56,88.36],zoom:12},
  Hyderabad:{center:[17.42,78.43],zoom:12},
  Pune:{center:[18.52,73.86],zoom:12},
  Goa:{center:[15.50,73.82],zoom:12},
  Noida:{center:[28.57,77.32],zoom:12},
  Gurgaon:{center:[28.47,77.09],zoom:12},
};

const typeColor={
  'cafe':'#FF6C41','cafe & food':'#FF6C41',
  'retail':'#7B2F25','retail & fashion':'#7B2F25',
  'studio':'#4A6B4A','studio & craft':'#4A6B4A',
  'wellness':'#B05878','wellness & health':'#B05878',
  'workspace':'#4A6B8A','community space':'#4A6B8A',
  'books & art':'#6B4A8A','shelter & support':'#8A6B4A',
};

function getTypeColor(t){return typeColor[t?.toLowerCase()]||'#FF6C41';}

let allPlaces=[];
let activeCity='Mumbai';
let activeCategory='all';
let activeNeigh='all';
let activeCardId=null;
let markers={};

// MAP
const map=L.map('map',{center:[19.05,72.87],zoom:12,zoomControl:false,attributionControl:false});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);

// FETCH FROM SUPABASE
async function fetchPlaces(){
  document.getElementById('cardsScroll').innerHTML='<div class="loading-state">Finding spaces…</div>';
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/submissions?status=eq.approved&select=*',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    if(!res.ok)throw new Error('fetch failed');
    allPlaces=await res.json();
    // normalise field names
    allPlaces=allPlaces.map((p,i)=>({
      id:p.id||i,
      name:p.space_name||'Unnamed',
      city:p.city||'Mumbai',
      area:p.neighbourhood||'',
      type:(p.category||'other').toLowerCase(),
      lat:parseFloat(p.lat)||null,
      lng:parseFloat(p.lng)||null,
      note:p.personal_note||'',
      instagram:p.space_instagram||p.owner_instagram||'',
      owner:p.owner_name||'',
      ownerPhoto:p.owner_photo_url||'',
      spacePhoto:p.space_photo_url||'',
    }));
  }catch(e){
    allPlaces=[];
  }
  buildUI();
}

function buildUI(){
  buildCityPills();
  buildNeighPills();
  buildMarkers();
  applyFilters();
}

// CITY PILLS
function buildCityPills(){
  const row=document.getElementById('cityRow');
  row.innerHTML='';
  const cities=Object.keys(cityCoords);
  cities.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='city-pill'+(c===activeCity?' active':'');
    btn.textContent=c;
    btn.onclick=()=>setCity(c,btn);
    row.appendChild(btn);
  });
}

// NEIGH PILLS
function buildNeighPills(){
  const row=document.getElementById('neighRow');
  row.innerHTML='';
  const allBtn=document.createElement('button');
  allBtn.className='neigh-pill active';
  allBtn.textContent='All areas';
  allBtn.onclick=()=>setNeigh('all',allBtn);
  row.appendChild(allBtn);
  const neighs=[...new Set(allPlaces.filter(p=>p.city===activeCity).map(p=>p.area))].filter(Boolean).sort();
  neighs.forEach(n=>{
    const btn=document.createElement('button');
    btn.className='neigh-pill';
    btn.textContent=n;
    btn.onclick=()=>setNeigh(n,btn);
    row.appendChild(btn);
  });
}

// MARKERS
function buildMarkers(){
  Object.values(markers).forEach(m=>{if(map.hasLayer(m))map.removeLayer(m);});
  markers={};
  allPlaces.forEach(p=>{
    if(!p.lat||!p.lng)return;
    const col=getTypeColor(p.type);
    const icon=L.divIcon({className:'',html:'<div style="width:12px;height:12px;background:'+col+';border-radius:50%;border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.22);cursor:pointer"></div>',iconSize:[12,12],iconAnchor:[6,6]});
    const mk=L.marker([p.lat,p.lng],{icon});
    mk.bindPopup('<div class="popup-name">'+p.name+'</div><div class="popup-area">'+p.area+(p.city?', '+p.city:'')+'</div>',{maxWidth:180,closeButton:false});
    mk.on('click',()=>openDetail(p.id));
    markers[p.id]=mk;
  });
}

function setCity(city,btn){
  activeCity=city;activeNeigh='all';activeCategory='all';
  document.querySelectorAll('.city-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));
  document.querySelector('.filter-pill').classList.add('active');
  buildNeighPills();
  const cv=cityCoords[city];
  map.flyTo(cv.center,cv.zoom,{duration:1.2});
  applyFilters();
}

function setCategory(cat,btn){
  activeCategory=cat;
  document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function setNeigh(n,btn){
  activeNeigh=n;
  document.querySelectorAll('.neigh-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters(){
  const filtered=allPlaces.filter(p=>{
    const matchCity=p.city===activeCity;
    const matchCat=activeCategory==='all'||p.type.includes(activeCategory);
    const matchNeigh=activeNeigh==='all'||p.area===activeNeigh;
    return matchCity&&matchCat&&matchNeigh;
  });
  renderCards(filtered);
  renderMarkers(filtered);
}

function renderMarkers(filtered){
  const ids=new Set(filtered.map(p=>p.id));
  allPlaces.forEach(p=>{
    const mk=markers[p.id];
    if(!mk)return;
    if(ids.has(p.id)){if(!map.hasLayer(mk))mk.addTo(map);}
    else{if(map.hasLayer(mk))map.removeLayer(mk);}
  });
}

function renderCards(filtered){
  const meta=document.getElementById('resultsMeta');
  const scroll=document.getElementById('cardsScroll');
  meta.innerHTML='<span>'+filtered.length+'</span> space'+(filtered.length!==1?'s':'')+' found in '+activeCity;
  if(filtered.length===0){
    scroll.innerHTML='<div class="empty-state"><div class="empty-icon">📍</div><div class="empty-text">No spaces found yet.<br>Be the first to pin one.</div></div>';
    return;
  }
  scroll.innerHTML=filtered.map(p=>`
    <div class="place-card${activeCardId===p.id?' active':''}" id="card-${p.id}" onclick="openDetail('${p.id}')">
      <div class="card-type">${p.type}</div>
      <div class="card-name">${p.name}</div>
      <div class="card-area">${p.area}${p.city?', '+p.city:''}</div>
      ${p.note?'<div class="card-note">'+p.note+'</div>':''}
    </div>
  `).join('');
}

function openDetail(id){
  activeCardId=id;
  const p=allPlaces.find(x=>x.id===id);
  if(!p)return;
  document.getElementById('dNote').textContent=p.note||'No note provided yet.';
  document.getElementById('dName').textContent=p.name;
  document.getElementById('dArea').textContent=(p.area?p.area+', ':'')+p.city;
  document.getElementById('dType').textContent=p.type;

  // photos
  const photosWrap=document.getElementById('dPhotos');
  const ownerWrap=document.getElementById('dOwnerPhotoWrap');
  const spaceWrap=document.getElementById('dSpacePhotoWrap');
  if(p.ownerPhoto||p.spacePhoto){
    photosWrap.style.display='block';
    if(p.ownerPhoto){ownerWrap.style.display='block';document.getElementById('dOwnerPhoto').src=p.ownerPhoto;}
    else{ownerWrap.style.display='none';}
    if(p.spacePhoto){spaceWrap.style.display='block';document.getElementById('dSpacePhoto').src=p.spacePhoto;}
    else{spaceWrap.style.display='none';}
  }else{photosWrap.style.display='none';}

  const instaWrap=document.getElementById('dInstaWrap');
  if(p.instagram){
    instaWrap.innerHTML='<a class="detail-insta" href="https://instagram.com/'+p.instagram.replace('@','')+'" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg> @'+p.instagram.replace('@','')+'</a>';
  }else{instaWrap.innerHTML='';}
  document.getElementById('detailPanel').classList.add('open');
  document.querySelectorAll('.place-card').forEach(c=>c.classList.remove('active'));
  const card=document.getElementById('card-'+id);
  if(card){card.classList.add('active');card.scrollIntoView({behavior:'smooth',block:'nearest'});}
  if(markers[id]&&p.lat&&p.lng){map.flyTo([p.lat,p.lng],15,{duration:0.8});markers[id].openPopup();}
}

function closeDetail(){
  document.getElementById('detailPanel').classList.remove('open');
  activeCardId=null;
  document.querySelectorAll('.place-card').forEach(c=>c.classList.remove('active'));
}

// SEARCH MODAL
function openSearch(){
  document.getElementById('searchModal').classList.add('open');
  setTimeout(()=>document.getElementById('modalSearchInput').focus(),50);
  renderSearchResults('');
}

function closeSearch(){
  document.getElementById('searchModal').classList.remove('open');
  document.getElementById('modalSearchInput').value='';
}

function handleSearchOverlay(e){
  if(e.target===document.getElementById('searchModal'))closeSearch();
}

function runSearch(){
  const q=document.getElementById('modalSearchInput').value.trim();
  renderSearchResults(q);
}

function renderSearchResults(q){
  const list=document.getElementById('searchResultsList');
  const filtered=q
    ?allPlaces.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())||p.area.toLowerCase().includes(q.toLowerCase())||p.city.toLowerCase().includes(q.toLowerCase()))
    :allPlaces.slice(0,12);
  if(filtered.length===0){
    list.innerHTML='<div class="search-empty">No spaces found for "'+q+'"</div>';
    return;
  }
  list.innerHTML=filtered.map(p=>`
    <div class="search-result-item" onclick="selectFromSearch('${p.id}')">
      <div class="sr-name">${p.name}</div>
      <div class="sr-meta">${p.area?p.area+', ':''}${p.city} &middot; ${p.type}</div>
    </div>
  `).join('');
}

function selectFromSearch(id){
  closeSearch();
  // switch to correct city first
  const p=allPlaces.find(x=>x.id===id);
  if(!p)return;
  if(p.city!==activeCity){
    const cityBtn=[...document.querySelectorAll('.city-pill')].find(b=>b.textContent===p.city);
    if(cityBtn)setCity(p.city,cityBtn);
  }
  setTimeout(()=>openDetail(id),200);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();closeDetail();}});

window.addEventListener('load',fetchPlaces);
</script>
